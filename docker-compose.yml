# Base stack. Publishes NOTHING to the host: every service talks over the
# internal network only. Exposure is opt-in via an overlay, so forgetting to
# apply one fails closed rather than open.
#
#   laptop:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   NAS:     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Overrides whatever .env says: inside this network the database is `db`,
      # regardless of the host-facing value used by npm scripts.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # What the app actually queries through. This role is not the superuser,
      # which matters: superusers bypass row-level security outright, so
      # connecting as one would leave every tenant policy enforcing nothing.
      # DATABASE_URL above stays for migrations and maintenance.
      APP_DATABASE_URL: postgres://howtomoney_app:${APP_DATABASE_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # What the app actually queries through. This role is not the superuser,
      # which matters: superusers bypass row-level security outright, so
      # connecting as one would leave every tenant policy enforcing nothing.
      # DATABASE_URL above stays for migrations and maintenance.
      APP_DATABASE_URL: postgres://howtomoney_app:${APP_DATABASE_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ['npm', 'run', 'worker']
