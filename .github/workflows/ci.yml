# Runs on every push and pull request. Four jobs, in parallel:
#
#   check   typecheck + the pure tests (parsers, crypto, assets, loans, advisor, health)
#   db      the database tests: tenant isolation, passwords, smoke (ON CONFLICT targets)
#   e2e     Playwright against the built app and the demo household
#   docker  the production image still builds
#
# Every database here is a throwaway Postgres service container; no secret from
# the real deployment is used or needed. ENCRYPTION_KEY is generated per run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm test
      # What ships to production (not dev tooling) must carry no known high or
      # critical vulnerability. Dependabot opens the PRs that clear these.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # The image production runs (docker-compose.yml).
        image: postgres:16-alpine
        env: { POSTGRES_USER: howtomoney, POSTGRES_PASSWORD: ci, POSTGRES_DB: howtomoney }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U howtomoney" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://howtomoney:ci@localhost:5432/howtomoney
      SMOKE_TEST_DATABASE_URL: postgres://howtomoney:ci@localhost:5432/howtomoney_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: psql "$DATABASE_URL" -c 'CREATE DATABASE howtomoney_test'
      # Isolation first: a scoping bug shows someone another household's money.
      - run: npm run test:isolation
      - run: npm run test:password
      - run: npm run test:smoke

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: howtomoney, POSTGRES_PASSWORD: ci, POSTGRES_DB: howtomoney }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U howtomoney" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://howtomoney:ci@localhost:5432/howtomoney
      APP_DATABASE_PASSWORD: ci-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # The restricted role, as in production: pointed at the superuser, RLS
      # enforces nothing and the tests would pass against a broken app.
      - run: npm run db:migrate
      - run: npm run db:approle
      - run: npm run demo:seed
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        # playwright.config.ts starts `node build/index.js` with this env.
        run: npx playwright test
        env:
          DATABASE_URL: postgres://howtomoney:ci@localhost:5432/howtomoney_demo
          APP_DATABASE_URL: postgres://howtomoney_app:ci-app@localhost:5432/howtomoney_demo
          ORIGIN: http://localhost:3000
          PORT: 3000
          AI_PROVIDER: none
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
